# Local browser access: docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d --build
# Default port 8083 avoids conflict with other local apps on 8082 (e.g. site-mate).
#
# Force local Postgres (do not inherit host Neon DATABASE_URL — unreachable from containers).

services:
  iaudit-app-postgres-1:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    networks:
      - app
      - local_postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@iaudit-app-postgres-1:5432/appdb?schema=public
    depends_on:
      iaudit-app-postgres-1:
        condition: service_healthy
    networks:
      - app
      - local_postgres

  frontend:
    ports:
      - "${FRONTEND_HOST_PORT:-8083}:80"
    networks:
      - app

networks:
  app:
    driver: bridge
  local_postgres:
    external: true
    name: iaudit-app_default

volumes:
  pgdata:
