server {
    listen 80;
    server_name localhost;

    # Short TTL so API container IP changes after redeploy are picked up quickly
    # (stale Docker DNS → connect() refused → intermittent 502).
    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 3s;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # PSZL-017: prevent clickjacking (login and all app pages)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;

    # Hashed Vite bundles — never SPA-fallback to index.html (that causes MIME type errors).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|css|js|map)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        try_files $uri =404;
    }

    # SPA routes only — HTML shell for client-side routing (never waits on API)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Edge liveness for Coolify / Traefik — MUST NOT proxy to the API.
    # Proxying /health to Node caused public-URL 504 when migrations blocked
    # the event loop or the DB probe hung (Traefik marked the whole site down).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"frontend","database":"skipped"}';
    }

    # Deep readiness (API + DB) — use for monitoring, not Traefik edge checks
    location = /health/ready {
        set $api_upstream server:3001;
        proxy_pass http://$api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_intercept_errors off;
        # "=200" prevents recursive error_page → /50x.html when this location returns.
        error_page 502 503 504 =200 @api_unavailable;
    }

    # Proxy API — variable upstream forces Docker DNS re-resolve if API restarts
    location /api/ {
        set $api_upstream server:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        # Do NOT set Connection: upgrade on all API traffic (breaks keep-alive reuse).
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Do not treat application JSON 503 (e.g. DB down) as a retryable upstream failure —
        # that can end up serving HTML 50x instead of the API error body.
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        error_page 502 503 504 =200 @api_unavailable;
    }

    location @api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        # Always JSON — never fall through to HTML /50x.html.
        return 200 '{"error":"API server is temporarily unavailable. Please try again shortly.","code":"API_UNAVAILABLE"}';
    }

    # Static-file / SPA shell failures only — never for /api/ (handled above).
    error_page 500 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }
}
