name: iaudit

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      pull: false
    restart: unless-stopped
    # Coolify injects env via the UI; .env is optional for local runs.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    healthcheck:
      # Ready only when DB is up AND bootstrap (migrate/seed) finished.
      # Bounded /health probe prevents hung checks under pool pressure.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/health')
          .then(async (r) => {
            const b = await r.json().catch(() => ({}));
            process.exit(r.ok && b.database === 'connected' && b.bootstrapComplete ? 0 : 1);
          })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      pull: false
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: server
      API_PORT: "3001"
    expose:
      - "80"
    # SPA must stay up during DB/API blips — never gate nginx on API readiness.
    depends_on:
      server:
        condition: service_started
    # Public Coolify/Traefik health check MUST be /nginx-health (see DOCKER_GUIDE.md).
    # Do not health-check the API through the public URL — that caused 504 cascades.
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - app

networks:
  app:
    driver: bridge
