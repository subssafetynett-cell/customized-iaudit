name: iaudit

# IMPORTANT (Coolify): Do NOT define custom `networks:` here.
# Custom networks put containers on two bridges; Traefik then non-deterministically
# routes to the wrong IP → intermittent "Gateway Timeout" after every redeploy.
# Coolify creates its own network and wires Traefik to it automatically.
# See: https://coolify.io/docs/applications/build-packs/docker-compose#do-not-define-custom-networks

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      pull: false
    restart: unless-stopped
    # Coolify: public traffic hits frontend only — do not gate the stack on API DB readiness.
    # exclude_from_hc: true
    # Coolify injects env via the UI; .env is optional for local runs.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    healthcheck:
      # Liveness only — Node is accepting connections. Do NOT require migrate/bootstrap
      # here: that kept the API "unhealthy" during startup and Coolify/Traefik returned
      # public Gateway Timeout (504) when the edge check was mis-pointed at the API.
      # Deep readiness remains GET /health and /api/health (bootstrapComplete + DB).
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/live')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      pull: false
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: server
      API_PORT: "3001"
    expose:
      - "80"
    # SPA must stay up during DB/API blips — never gate nginx on API readiness.
    depends_on:
      server:
        condition: service_started
    # Public Coolify/Traefik health check MUST be /nginx-health (see DOCKER_GUIDE.md).
    # Do not health-check the API through the public URL — that caused 504 cascades.
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
